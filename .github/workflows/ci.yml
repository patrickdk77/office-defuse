name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Install python3 and unzip
        # The tests read the ZIP writer's output back with Python's zipfile and unzip -t, and fail when either is missing.
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 unzip
          python3 --version
          unzip -v | head -1
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
